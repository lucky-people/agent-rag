# ruff 配置：温和起步，只开默认安全规则集，避免误伤
# 规则说明：E4/E7/E9 = pycodestyle 语法/逻辑错误子集；F = pyflakes 未定义/未使用等
# 后续可逐步开启更多规则（I 导入排序 / UP 升级建议 / B bugbear）
line-length = 120
target-version = "py311"

exclude = [
    "config_local",          # 本地密钥，不入库
    "models",                # 模型权重与缓存
    "datasets",                # 原始数据
    "图片",                   # 截图素材
    "docs",                  # 文档与图件
    "scripts/results",       # 实验输出产物
    ".git",
    "__pycache__",
    "*.pyc",
]

[lint]
select = ["E4", "E7", "E9", "F"]

# 项目惯例：先注入 sys.path 再导入内部模块（Agent 与scripts统一此写法），
# 因此 E402（import 不在文件顶部）按目录豁免，避免误报
# E701（单行 if 提前返回）为项目惯用的 guard clause 写法，可读性良好，豁免
[lint.per-file-ignores]
"Agent/**/*.py" = ["E402"]
"scripts/**/*.py" = ["E402"]
"tests/**/*.py" = ["E402"]
"Agent/web_server.py" = ["E701"]
"scripts/run_intent_evaluation.py" = ["E701"]
